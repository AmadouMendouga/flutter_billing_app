org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The project path contains an accented character ("Terminé"), which AGP's
# path check rejects out of excess caution on Windows. Non-ASCII paths work
# fine in practice; this just disables the warning-turned-error.
android.overridePathCheck=true
# This connection is dropping mid-download frequently; make Gradle's
# dependency downloader far more patient and retry-happy instead of
# giving up on the whole build after one failed artifact.
systemProp.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000
systemProp.https.connectionTimeout=180000
systemProp.https.socketTimeout=180000
org.gradle.internal.repository.max.retries=10
org.gradle.internal.repository.initial.backoff=500
# Fewer parallel downloads so the limited bandwidth isn't split thin
# across many competing connections that then all stall together.
org.gradle.workers.max=2
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
